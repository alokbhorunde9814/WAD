<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Assignment 1b Code</title>
  <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    form, h1 {
      width: 30%;
      margin: 5% auto;
    }
    input {
      margin: 1%;
    }
  </style>
</head>
<body>
  <h1>USER REGISTRATION</h1>
  <form action="" method="POST">
    <label>Full Name</label>
    <input type="text" name="fullName" id="fullName" class="form-control" placeholder="Name Surname" pattern="[A-Za-z ]*" required>

    <label>Email</label>
    <input type="email" name="userEmail" id="userEmail" class="form-control" required>

    <label>User Name</label>
    <input type="text" name="userName" id="userName" class="form-control" required>

    <label>Password</label>
    <input type="password" name="userPassword" id="userPassword" class="form-control" required>

    <input type="button" onclick="submitForm()" value="SUBMIT DETAILS" class="btn btn-primary w-100">
  </form>

  <script>
    function submitForm() {
      var name = $('#fullName').val();
      var email = $('#userEmail').val();
      var username = $('#userName').val();
      var password = $('#userPassword').val(); // Not sent for security demo

      var data = 'name=' + encodeURIComponent(name) +
                 '&email=' + encodeURIComponent(email) +
                 '&username=' + encodeURIComponent(username);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'output.php', true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

      xhr.onload = function() {
        var newWindow = window.open('', '_blank');
        newWindow.document.write(xhr.responseText);
      };

      xhr.send(data);
    }
  </script>
</body>
</html>
