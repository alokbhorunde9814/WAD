<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>Dashboard</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" 
rel="stylesheet"> 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
  <style> 
    body { 
      display: flex; 
      min-height: 100vh; 
    } 
    .sidebar { 
      width: 250px; 
      background-color: #343a40; 
      color: #fff; 
    } 
    .sidebar .nav-link { 
      color: #adb5bd; 
    } 
    .sidebar .nav-link.active { 
      background-color: #495057; 
      color: #fff; 
    } 
    .content { 
      flex: 1; 
      background-color: #f8f9fa; 
    } 
    .card { 
      color: #fff; 
    } 
    .navbar { 
      background-color: #212529; 
    } 
    .form-control::placeholder { 
      color: #999; 
    } 
  </style> 
</head> 
<body> 
  <div class="sidebar d-flex flex-column p-3"> 
    <h4 class="text-white">CORE</h4> 
    <a href="#" class="nav-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a> 
    <h6 class="mt-4 text-white">INTERFACE</h6> 
    <a href="#" class="nav-link"><i class="fas fa-columns"></i> Layouts</a> 
    <a href="#" class="nav-link"><i class="fas fa-book"></i> Pages</a> 
    <h6 class="mt-4 text-white">ADDONS</h6> 
    <a href="#" class="nav-link"><i class="fas fa-chart-area"></i> Charts</a> 
    <a href="#" class="nav-link"><i class="fas fa-table"></i> Tables</a> 
  </div> 
 
  <div class="content"> 
    <nav class="navbar navbar-dark"> 
      <div class="container-fluid"> 
        <form class="d-flex" style="width: 400px;"> 
          <input class="form-control me-2" type="search" placeholder="Search" 
aria-label="Search"> 
          <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i></button> 
        </form> 
      </div> 
    </nav> 
 
    <div class="container-fluid p-4"> 
      <h2>Dashboard</h2> 
      <div class="row g-3 mb-4"> 
        <div class="col-md-3"> 
          <div class="card bg-primary"> 
            <div class="card-body">Primary Card</div> 
            <div class="card-footer text-end"><a href="#" class="text-white 
text-decoration-none">View Details <i class="fas fa-arrow-right"></i></a></div> 
          </div> 
        </div> 
        <div class="col-md-3"> 
          <div class="card bg-warning"> 
            <div class="card-body">Warning Card</div> 
            <div class="card-footer text-end"><a href="#" class="text-dark 
text-decoration-none">View Details <i class="fas fa-arrow-right"></i></a></div> 
          </div> 
        </div> 
        <div class="col-md-3"> 
          <div class="card bg-success"> 
            <div class="card-body">Success Card</div> 
            <div class="card-footer text-end"><a href="#" class="text-white 
text-decoration-none">View Details <i class="fas fa-arrow-right"></i></a></div> 
          </div> 
        </div> 
        <div class="col-md-3"> 
          <div class="card bg-danger"> 
            <div class="card-body">Danger Card</div> 
            <div class="card-footer text-end"><a href="#" class="text-white 
text-decoration-none">View Details <i class="fas fa-arrow-right"></i></a></div> 
          </div> 
        </div> 
      </div> 
 
      <div class="row"> 
        <div class="col-md-6"> 
          <div class="card"> 
            <div class="card-header"><i class="fas fa-chart-area"></i> Area Chart Example</div> 
            <div class="card-body"> 
              <canvas id="chart1"></canvas> 
            </div> 
          </div> 
        </div> 
        <div class="col-md-6"> 
          <div class="card"> 
            <div class="card-header"><i class="fas fa-chart-area"></i> Area Chart Example</div> 
            <div class="card-body"> 
              <canvas id="chart2"></canvas> 
            </div> 
          </div> 
        </div> 
      </div> 
    </div> 
  </div> 
 
  <script> 
    const data = { 
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'], 
      datasets: [{ 
        label: '# of Votes', 
        data: [12, 19, 3, 5, 2, 3], 
        backgroundColor: [ 
          'rgba(255, 99, 132, 0.2)', 
          'rgba(54, 162, 235, 0.2)', 
          'rgba(255, 206, 86, 0.2)', 
          'rgba(75, 192, 192, 0.2)', 
          'rgba(153, 102, 255, 0.2)', 
          'rgba(255, 159, 64, 0.2)' 
        ], 
        borderColor: [ 
          'rgba(255, 99, 132, 1)', 
          'rgba(54, 162, 235, 1)', 
          'rgba(255, 206, 86, 1)', 
          'rgba(75, 192, 192, 1)', 
          'rgba(153, 102, 255, 1)', 
          'rgba(255, 159, 64, 1)' 
        ], 
        borderWidth: 1 
      }] 
    }; 
    new Chart(document.getElementById('chart1'), { type: 'bar', data }); 
    new Chart(document.getElementById('chart2'), { type: 'bar', data }); 
  </script> 
</body> 
</html>
